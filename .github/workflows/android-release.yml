name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: |
          npm run typecheck
          npm test

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare release asset
        run: cp android/app/build/outputs/apk/release/app-release.apk Your-Cycle.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Your-Cycle-${{ inputs.version }}
          path: Your-Cycle.apk
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Your-Cycle.apk --clobber
          else
            gh release create "$RELEASE_TAG" Your-Cycle.apk \
              --target "$GITHUB_SHA" \
              --title "Your Cycle / Döngün $RELEASE_TAG" \
              --notes "Installable Android test APK. Free, ad-free, account-free, and local-only. This is not a Play Store-signed production release."
          fi
